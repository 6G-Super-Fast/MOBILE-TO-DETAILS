<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOBILE TO DETAILS PRO</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; user-select: none; }
        html, body {
            background: #f9ca24 !important;
            overflow: hidden !important;
            margin: 0 !important;
            padding: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            font-family: 'Poppins', 'Segoe UI', sans-serif !important;
        }
        
        /* Scrollbar Styling */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f9ca24; }
        ::-webkit-scrollbar-thumb { background: #000; border-radius: 10px; }

        #panFinderCard {
            max-width: 650px; 
            width: 95%;
            padding: 30px 25px 25px 25px;
            background: #f9ca24;
            border: 2px solid #000000;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            cursor: grab;
            margin: 0; 
            display: flex;
            flex-direction: column;
            max-height: 95vh; 
        }
        .badge {
            display: inline-block;
            background: transparent;
            color: #000;
            border: 2px solid #000;
            font-size: 12px;
            font-weight: 800;
            padding: 5px 18px;
            border-radius: 30px;
            letter-spacing: 1.5px;
            margin-bottom: 15px;
        }
        h2 { font-size: 24px; font-weight: 800; color: #000; margin: 0 0 4px 0; }
        .subtitle { font-size: 14px; color: #000; margin: 0 0 20px 0; font-weight: 500; opacity: 0.8; }
        .form-group { margin-bottom: 15px; text-align: left; width: 100%; }
        label { display: block; font-size: 14px; font-weight: 600; color: #000; margin-bottom: 6px; }
        input[type="text"] {
            background: transparent;
            border: 2px solid #000;
            color: #000;
            padding: 12px 16px;
            font-size: 18px;
            border-radius: 10px;
            width: 100%;
            font-weight: 600;
            outline: none;
            cursor: text;
            user-select: text;
        }
        .btn-main {
            background: transparent;
            color: #000;
            border: 2px solid #000;
            padding: 14px 20px;
            font-size: 16px;
            font-weight: 800;
            border-radius: 10px;
            width: 100%;
            cursor: pointer;
            transition: all 0.3s;
            margin: 10px 0 15px 0;
            font-family: inherit;
        }
        .btn-main:hover { background: #000; color: #f9ca24; }
        .result-wrapper { 
            width: 100%; 
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        #fakeResultDiv {
            background: transparent;
            border: 2px solid #000;
            border-radius: 8px;
            padding: 12px 16px;
            font-size: 14px;
            font-weight: 600;
            line-height: 1.6;
            color: #000;
            min-height: 50px;
            max-height: 50vh; 
            overflow-y: auto; 
            text-align: left;
            user-select: text;
            word-break: break-word;
        }
        
        #fakeResultDiv::-webkit-scrollbar { width: 6px; }
        #fakeResultDiv::-webkit-scrollbar-track { background: transparent; }
        #fakeResultDiv::-webkit-scrollbar-thumb { background: #000; border-radius: 10px; }
        
        .btn-group {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            width: 100%;
            margin-top: 15px;
        }
        .btn-sub {
            flex: 1;
            background: transparent;
            color: #000;
            border: 2px solid #000;
            padding: 10px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            font-family: inherit;
            transition: 0.3s;
        }
    </style>
</head>
<body>

    <div id="panFinderCard">
        <div class="badge">👑 VIP ACCESS</div>
        <h2>📱 MOBILE TO DETAILS</h2>
        <p class="subtitle">Instantly fetch details from mobile number</p>

        <form id="checkForm" onsubmit="event.preventDefault();">
            <div class="form-group">
                <label for="mobileInput">Mobile Number</label>
                <input type="text" id="mobileInput" maxlength="10" autocomplete="off">
            </div>

            <button type="submit" id="checkBtn" class="btn-main">CHECK DETAILS</button>
        </form>

        <div class="result-wrapper">
            <div id="fakeResultDiv"></div>
        </div>

        <div class="btn-group">
            <button type="button" id="copyBtn" class="btn-sub">📋 COPY TEXT</button>
            <button type="button" id="resetBtn" class="btn-sub">🔄 RESET</button>
        </div>
    </div>

    <script>
        const card = document.getElementById('panFinderCard');
        const mobileInput = document.getElementById('mobileInput');
        const checkBtn = document.getElementById('checkBtn');
        const fakeResultDiv = document.getElementById('fakeResultDiv');
        const copyBtn = document.getElementById('copyBtn');
        const resetBtn = document.getElementById('resetBtn');

        window.formattedCopyText = "";

        [mobileInput, checkBtn, fakeResultDiv, copyBtn, resetBtn].forEach(el => {
            el.addEventListener('mousedown', (e) => e.stopPropagation());
        });

        const savedX = localStorage.getItem('mobileCardX');
        const savedY = localStorage.getItem('mobileCardY');
        if (savedX !== null && savedY !== null) {
            card.style.left = savedX + 'px';
            card.style.top = savedY + 'px';
            card.style.transform = 'none';
        }

        let isDragging = false, offsetX, offsetY;
        card.addEventListener('mousedown', (e) => {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'BUTTON' || e.target === fakeResultDiv) return;
            isDragging = true;
            const rect = card.getBoundingClientRect();
            if (card.style.transform !== 'none') {
                card.style.transform = 'none';
                card.style.left = rect.left + 'px';
                card.style.top = rect.top + 'px';
            }
            offsetX = e.clientX - rect.left;
            offsetY = e.clientY - rect.top;
            card.style.cursor = 'grabbing';
        });

        document.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            card.style.left = (e.clientX - offsetX) + 'px';
            card.style.top = (e.clientY - offsetY) + 'px';
        });

        document.addEventListener('mouseup', () => {
            if (isDragging) {
                isDragging = false;
                card.style.cursor = 'grab';
                const rect = card.getBoundingClientRect();
                localStorage.setItem('mobileCardX', rect.left);
                localStorage.setItem('mobileCardY', rect.top);
            }
        });

        async function fetchStatus(queryStr) {
            const url = `https://admin.gbssystems.com/public/api/v1/api.php?key=8AF6N&cmd=phoneinfo&query=${queryStr}`;
            const res = await fetch(url);
            if (!res.ok) throw new Error("HTTP error: " + res.status);
            return await res.json();
        }

        const emojis = ['1️⃣', '2️⃣', '3️⃣', '4️⃣', '5️⃣', '6️⃣', '7️⃣', '8️⃣', '9️⃣', '🔟'];

        checkBtn.addEventListener('click', async () => {
            const mobileVal = mobileInput.value.trim();

            if (mobileVal.length !== 10 || isNaN(mobileVal)) {
                fakeResultDiv.innerText = 'Enter a valid 10-digit mobile number';
                return;
            }

            fakeResultDiv.innerText = 'Fetching mobile records...';
            window.formattedCopyText = ""; 

            try {
                const response = await fetchStatus(mobileVal);

                if (response && response.status === "SUCCESS" && response.result) {
                    const rawRecords = response.result;
                    
                    // Deduplication logic based on mobile number
                    let uniqueRecords = [];
                    let seenNumbers = new Set();
                    
                    rawRecords.forEach(item => {
                        const mobKey = item.mobile || '';
                        if (mobKey && !seenNumbers.has(mobKey)) {
                            seenNumbers.add(mobKey);
                            uniqueRecords.push(item);
                        }
                    });

                    const count = uniqueRecords.length;
                    
                    let displayHTML = `📱 <b>Mobile Records Details</b> 📱<br>`;
                    displayHTML += `📊 Total Records: ${count}<br><br>`;

                    let copyText = `📱 Mobile Records Details 📱\n`;
                    copyText += `📊 Total Records: ${count}\n\n`;

                    if (count > 0) {
                        uniqueRecords.forEach((item, index) => {
                            const emoji = index < 10 ? emojis[index] : `${index + 1}️⃣`;
                            
                            let altNo = (item.alternate_mobile && item.alternate_mobile.trim() !== "") ? item.alternate_mobile : "N/A";
                            let email = (item.email && item.email !== null && item.email.trim() !== "") ? item.email : "N/A";
                            let aadharNo = (item.aadhar && item.aadhar.trim() !== "") ? item.aadhar : "N/A";
                            
                            displayHTML += `${emoji}<br>`;
                            displayHTML += `👤 Name: ${item.name || 'N/A'}<br>`;
                            displayHTML += `👨 Father: ${item.father_name || 'N/A'}<br>`;
                            displayHTML += `📞 Number: ${item.mobile || 'N/A'}<br>`;
                            displayHTML += `☎️ Alt No: ${altNo}<br>`;
                            displayHTML += `📧 Email: ${email}<br>`;
                            displayHTML += `🔒 Aadhaar: ${aadharNo}<br>`;
                            displayHTML += `📶 Circle: ${item.circle || 'N/A'}<br>`;
                            displayHTML += `🏠 Address: ${item.address || 'N/A'}<br><br>`;

                            copyText += `${emoji}\n`;
                            copyText += `👤 Name: ${item.name || 'N/A'}\n`;
                            copyText += `👨 Father: ${item.father_name || 'N/A'}\n`;
                            copyText += `📞 Number: ${item.mobile || 'N/A'}\n`;
                            copyText += `☎️ Alt No: ${altNo}\n`;
                            copyText += `📧 Email: ${email}\n`;
                            copyText += `🔒 Aadhaar: ${aadharNo}\n`;
                            copyText += `📶 Circle: ${item.circle || 'N/A'}\n`;
                            copyText += `🏠 Address: ${item.address || 'N/A'}\n\n`;
                        });
                    } else {
                        displayHTML += `No unique records found.`;
                        copyText += `No unique records found.`;
                    }

                    fakeResultDiv.innerHTML = displayHTML;
                    window.formattedCopyText = copyText.trim();

                } else {
                    fakeResultDiv.innerText = 'NO RECORDS FOUND ❌';
                }
            } catch (err) {
                console.error(err);
                fakeResultDiv.innerText = 'ERROR 404 BYE BYE...';
            }
        });

        function copyTextToClipboard(text) {
            if (navigator.clipboard && window.isSecureContext) {
                return navigator.clipboard.writeText(text);
            } else {
                const ta = document.createElement("textarea");
                ta.value = text;
                ta.style.position = "fixed";
                ta.style.left = "-999999px";
                document.body.appendChild(ta);
                ta.focus();
                ta.select();
                return new Promise((res, rej) => {
                    document.execCommand('copy') ? res() : rej();
                    ta.remove();
                });
            }
        }

        copyBtn.onclick = async () => {
            if (!window.formattedCopyText) return;

            try {
                await copyTextToClipboard(window.formattedCopyText);
                copyBtn.textContent = '✅ COPIED!';
                copyBtn.style.background = '#27ae60';
                copyBtn.style.color = '#fff';
                copyBtn.style.borderColor = '#27ae60';
                setTimeout(() => {
                    copyBtn.textContent = '📋 COPY TEXT';
                    copyBtn.style.background = 'transparent';
                    copyBtn.style.color = '#000';
                    copyBtn.style.borderColor = '#000';
                }, 1500);
            } catch (e) {
                console.error("Copy failed:", e);
            }
        };

        resetBtn.onclick = () => {
            mobileInput.value = '';
            fakeResultDiv.innerHTML = '';
            window.formattedCopyText = '';
            localStorage.removeItem('mobileCardX');
            localStorage.removeItem('mobileCardY');
            card.style.transform = 'translate(-50%, -50%)';
            card.style.top = '50%';
            card.style.left = '50%';
        };
    </script>
</body>
</html>
